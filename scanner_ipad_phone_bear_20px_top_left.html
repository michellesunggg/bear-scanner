<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#34251c">
<title>熊叔叔·错误物品扫描仪</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#211d19;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#211d19;isolation:isolate}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#211d19;-webkit-transform:translateZ(0)}
/* 全屏扫描特效：仅点击开始扫描时触发，5 秒后自动淡出 */
#initialScan{position:absolute;z-index:8;inset:0;overflow:hidden;pointer-events:none;opacity:0;animation:none;background:radial-gradient(circle at center,transparent 0 12%,rgba(55,165,255,.10) 12.2% 12.6%,transparent 12.8% 27%,rgba(55,165,255,.18) 27.2% 27.7%,transparent 28% 43%,rgba(55,165,255,.22) 43.2% 43.7%,transparent 44% 59%,rgba(55,165,255,.26) 59.2% 59.7%,transparent 60%),repeating-conic-gradient(from 0deg at center,rgba(70,175,255,.20) 0deg .35deg,transparent .5deg 15deg),radial-gradient(ellipse at center,rgba(45,135,235,.14),rgba(0,45,95,.16) 70%,rgba(0,0,0,.2));mix-blend-mode:screen}
#initialScan.active{animation:fullScreenScan 5s ease-in-out forwards}
#initialScan:before{content:"";position:absolute;width:min(145vw,145vh);height:min(145vw,145vh);max-width:none;max-height:none;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(55,155,255,.02) 300deg,rgba(55,155,255,.07) 320deg,rgba(65,165,255,.20) 342deg,rgba(80,180,255,.48) 358deg,rgba(255,255,255,.88) 360deg);filter:drop-shadow(0 0 18px rgba(35,145,255,.62));transform-origin:50% 50%;animation:radarRotate 1.8s linear infinite;mask-image:radial-gradient(circle,#000 0 99%,transparent 100%)}
#initialScan:after{content:"";position:absolute;left:0;right:0;top:0;height:100%;border:3px solid rgba(85,175,255,.88);box-shadow:inset 0 0 70px rgba(35,135,255,.34),inset 0 0 150px rgba(35,135,255,.18);animation:scanFramePulse .55s ease-in-out infinite alternate}
@keyframes radarRotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes scanFramePulse{from{opacity:.55;filter:brightness(1)}to{opacity:1;filter:brightness(1.8)}}
@keyframes fullScreenScan{0%{opacity:1;transform:translateY(0);filter:brightness(1.2)}12%{opacity:1;filter:brightness(1.8)}78%{opacity:1;filter:brightness(1.45)}100%{opacity:0;transform:translateY(0);filter:brightness(1)}}
.topbar{position:absolute;z-index:10;top:calc(max(12px,env(safe-area-inset-top)) + 22px);left:calc(max(14px,env(safe-area-inset-left)) + 26px);right:12px;display:flex;align-items:center;gap:12px;pointer-events:none}
.bear-wrap{position:relative;flex:none;width:clamp(104px,14vw,136px);height:clamp(104px,14vw,136px)}
.bear-avatar{width:100%;height:100%;border-radius:50%;border:4px solid #fff4d8;object-fit:cover;object-position:center;box-shadow:0 3px 14px #0009;background:#f8dfad;display:block}
.thought-bubble{position:absolute;right:-13px;top:-9px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fffdf4;border:2px solid #704b32;color:#d33b32;font-size:25px;font-weight:900;line-height:1;box-shadow:0 2px 7px #0006;z-index:2}
.thought-bubble:before,.thought-bubble:after{content:"";position:absolute;border-radius:50%;background:#fffdf4;border:1.5px solid #704b32}
.thought-bubble:before{width:9px;height:9px;left:-5px;bottom:-5px}
.thought-bubble:after{width:5px;height:5px;left:-10px;bottom:-12px}
#scanArea{position:absolute;inset:0;z-index:5;overflow:hidden;touch-action:none}
.scan-mark{position:absolute;width:clamp(160px,24vw,240px);height:clamp(160px,24vw,240px);transform:translate(-50%,-50%);border:0;border-radius:50%;pointer-events:none;animation:scannerPulse 1s ease-in-out infinite;filter:drop-shadow(0 0 7px #168fff)}
/* 外层扫描刻度环 */
.scan-mark:before{content:"";position:absolute;inset:5px;border:3px dashed rgba(75,180,255,.95);border-radius:50%;animation:spin 8s linear infinite}
/* 旋转雷达扫描扇形 */
.scan-mark:after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 285deg,rgba(45,145,255,.08) 300deg,rgba(55,165,255,.95) 350deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 6px));animation:spin 1.35s linear infinite}
.scan-mark .target-ring{position:absolute;inset:20px;border:3px solid #55b5ff;border-radius:50%;box-shadow:0 0 12px #168fff,inset 0 0 10px #168fff}
.scan-mark .corner{position:absolute;width:28px;height:28px;border-color:#55b5ff;border-style:solid;filter:drop-shadow(0 0 5px #168fff)}
.scan-mark .tl{left:0;top:0;border-width:4px 0 0 4px;border-radius:9px 0 0}
.scan-mark .tr{right:0;top:0;border-width:4px 4px 0 0;border-radius:0 9px 0 0}
.scan-mark .bl{left:0;bottom:0;border-width:0 0 4px 4px;border-radius:0 0 0 9px}
.scan-mark .br{right:0;bottom:0;border-width:0 4px 4px 0;border-radius:0 0 9px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scannerPulse{0%,100%{opacity:1;filter:brightness(1.15) drop-shadow(0 0 8px #168fff)}50%{opacity:.58;filter:brightness(1.8) drop-shadow(0 0 19px #55b5ff)}}
.bottom{position:absolute;z-index:20;right:max(16px,env(safe-area-inset-right));left:auto;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:flex-end;pointer-events:none;padding:0}
#clearBtn{pointer-events:auto;min-width:0;width:148px;height:48px;box-sizing:border-box;padding:0 8px;border:2px solid #fff;border-radius:28px;background:linear-gradient(#65bdff,#1674d5);color:#fff;font-size:clamp(15px,2vw,18px);font-weight:900;letter-spacing:1px;box-shadow:0 4px 0 #084b9b,0 7px 18px #0006;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
#clearBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #084b9b}
#scanControls{position:absolute;z-index:30;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 58px);top:auto;display:flex;gap:8px;align-items:center}
#scanControls button{width:148px;height:48px;min-height:48px;box-sizing:border-box;padding:0 8px;border:2px solid #fff;border-radius:28px;color:#fff;font-size:clamp(15px,2vw,18px);font-weight:900;letter-spacing:1px;box-shadow:0 4px 0 #084b9b,0 7px 18px #0006;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:manipulation;display:flex;align-items:center;justify-content:center}
#startScanBtn{background:rgba(24,112,190,.96)}
#scanControls button:active{transform:scale(.96);background:rgba(25,105,175,.98)}
@media(orientation:landscape){.topbar{gap:10px}.bottom{bottom:max(14px,env(safe-area-inset-bottom))}#scanControls{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 56px)}}
/* 手机横屏：缩小左上角头像，确保画面与操作按钮有足够空间 */
@media (orientation:landscape) and (max-height:520px) and (max-width:950px){.topbar{top:calc(env(safe-area-inset-top) + 1px);left:calc(env(safe-area-inset-left) + 1px);right:auto;gap:3px}.bear-wrap{width:20px;height:20px}.thought-bubble{width:9px;height:9px;right:-3px;top:-2px;font-size:7px;border-width:1px}.thought-bubble:before{width:5px;height:5px;left:-3px;bottom:-3px}.thought-bubble:after{width:3px;height:3px;left:-6px;bottom:-7px}.bottom{right:max(12px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}#scanControls{right:max(12px,env(safe-area-inset-right));bottom:calc(max(10px,env(safe-area-inset-bottom)) + 54px);gap:6px}#clearBtn,#scanControls button{width:132px;height:44px;min-height:44px;font-size:15px}}
/* 手机竖屏：熊叔叔缩小并靠左上角，减少对摄像头画面的遮挡 */
@media (max-width: 600px) and (orientation: portrait){.topbar{top:calc(env(safe-area-inset-top) + 1px);left:calc(env(safe-area-inset-left) + 1px);right:auto;gap:3px}.bear-wrap{width:20px;height:20px}.thought-bubble{width:9px;height:9px;right:-3px;top:-2px;font-size:7px;border-width:1px}.thought-bubble:before{width:5px;height:5px;left:-3px;bottom:-3px}.thought-bubble:after{width:3px;height:3px;left:-6px;bottom:-7px}}
</style>
</head>

const video=document.getElementById('camera');
const scanArea=document.getElementById('scanArea');
const clearBtn=document.getElementById('clearBtn');
const startScanBtn=document.getElementById('startScanBtn');
let cameraStream=null,audioCtx=null;
const initialScan=document.getElementById('initialScan');
function requestLandscape(){
  // 支持屏幕方向锁定的浏览器可在用户点击按钮后尝试锁定；iPhone Safari 通常需手动旋转设备。
  if(screen.orientation&&typeof screen.orientation.lock==='function'){
    screen.orientation.lock('landscape').catch(()=>{});
  }
}
async function startCamera(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('当前环境不支持摄像头');
    cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    video.srcObject=cameraStream;
    await video.play();
    requestLandscape();
  }catch(err){
    console.error('摄像头启动失败：',err);
    // 不显示额外的引导页或点击按钮；浏览器/扣子宿主若要求手势授权，需由宿主开放 camera 权限。
  }
}
function initAudio(){
  if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
}
function playBeep(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  for(let i=0;i<5;i++){
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),start=t+i*.23;
    osc.type='sine';osc.frequency.setValueAtTime(880,start);
    gain.gain.setValueAtTime(.0001,start);
    const peakVolume=i===4?.34:.20;
    gain.gain.exponentialRampToValueAtTime(peakVolume,start+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,start+.13);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(start);osc.stop(start+.15);
  }
}

introScanAudio.preload='auto';
function playIntroScanSound(replay=false){
  if(introAudioStarted&&!replay)return;
  introScanAudio.pause();
  try{introScanAudio.currentTime=0;}catch(e){}
  const result=introScanAudio.play();
  if(result&&typeof result.then==='function'){
    result.then(()=>{introAudioStarted=true;}).catch(()=>{introAudioStarted=false;});
  }else{
    introAudioStarted=true;
  }
}
function placeScanMark(clientX,clientY){
  initAudio();
  const rect=scanArea.getBoundingClientRect(),mark=document.createElement('div');
  mark.className='scan-mark';
  mark.style.left=(clientX-rect.left)+'px';
  mark.style.top=(clientY-rect.top)+'px';
  mark.innerHTML='<span class="target-ring"></span><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>';
  scanArea.appendChild(mark);playBeep();
}
if(window.PointerEvent){
  scanArea.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    e.preventDefault();placeScanMark(e.clientX,e.clientY);
  },{passive:false});
}else{
  scanArea.addEventListener('touchstart',e=>{
    if(!e.changedTouches||!e.changedTouches.length)return;
    e.preventDefault();const t=e.changedTouches[0];placeScanMark(t.clientX,t.clientY);
  },{passive:false});
  scanArea.addEventListener('mousedown',e=>{
    if(e.button!==0)return;e.preventDefault();placeScanMark(e.clientX,e.clientY);
  });
}
clearBtn.addEventListener('click',()=>scanArea.replaceChildren());
// 点击“开始扫描”播放 5 秒全屏扫描特效与用户选定的扫描音乐。
function replayFullScan(){
  initialScan.classList.remove('active');
  void initialScan.offsetWidth; // 强制重排，确保连续点击也能从头播放动画
  initialScan.classList.add('active');
  initAudio();
  playIntroScanSound(true);
}
startScanBtn.addEventListener('click',()=>{requestLandscape();replayFullScan();});
clearBtn.addEventListener('click',requestLandscape);
// 页面打开即请求后置摄像头权限，无需先点击网页内按钮。
window.addEventListener('load',()=>{startCamera();},{once:true});
